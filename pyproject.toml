[project]
name = "algo-trading"
version = "0.1.0"
description = "Modular algorithmic trading system — quant hedge fund logic at retail scale"
requires-python = ">=3.11"
authors = [{ name = "Prince" }]

dependencies = [
    # Core async
    "uvloop>=0.19.0",
    "orjson>=3.10.0",

    # Data & indicators
    "pandas>=2.2.0",
    "ta>=0.11.0",                  # Technical analysis (replaces pandas-ta, which is no longer maintained)
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",          # Parquet read/write

    # Exchange connections
    "websockets>=12.0",
    "httpx>=0.27.0",
    "ccxt>=4.2.0",              # Unified crypto exchange API

    # Messaging & storage
    "redis>=5.0.0",
    "pyzmq>=25.1.0",

    # Logging & config
    "structlog>=24.1.0",

    # Types & validation
    "msgspec>=0.18.0",
]

[project.optional-dependencies]
backtest = [
    "vectorbt>=0.26.0",
    "nautilus_trader>=1.190.0",
]
agents = [
    "anthropic>=0.25.0",
]
options = [
    "py_vollib>=1.0.1",
    "py_vollib_vectorized>=0.1.0",
    "ib_insync>=0.9.86",
]
telegram = [
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
