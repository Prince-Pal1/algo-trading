[limits]
max_risk_per_trade = 0.02       # 2% of equity (hard cap)
max_daily_loss = 0.03           # 3% daily drawdown halt
max_weekly_loss = 0.06          # 6% weekly drawdown — reduce size
max_monthly_loss = 0.10         # 10% monthly — halt + review
max_drawdown = 0.15             # 15% from peak — emergency close all
max_position_pct = 0.20         # No single position > 20% of equity
max_portfolio_heat = 0.50       # Max 50% of equity at risk
max_correlated_exposure = 0.40  # Correlated strategies capped at 40%

[circuit_breakers]
daily_halt_enabled = true
weekly_reduce_enabled = true
weekly_reduce_factor = 0.5      # Cut position sizes by half
monthly_halt_enabled = true
max_drawdown_close_all = true

[kelly]
default_fraction = 0.25         # Quarter Kelly (FORTRESS mode)
max_fraction = 0.50             # Half Kelly cap
min_win_rate_for_kelly = 0.45   # Below this, use fixed sizing
min_trades_for_kelly = 30       # Need 30+ trades before Kelly kicks in

[fat_finger]
max_order_value_usd = 10000     # No single order > $10K (paper phase)
max_quantity_multiplier = 10    # No order > 10x average trade size

[leverage]
# G.0c leverage-first safety gates. Hard limits enforced by RiskManager —
# M3S cannot override these. Fire only on signals with an explicit
# `leverage` field set (crypto spot strategies leave it None, so these
# gates are no-ops for them).
gates_enabled = true                    # Master toggle
max_aggregate_leverage = 100.0          # Portfolio-wide effective leverage cap
max_per_position_leverage = 500.0       # Per-signal absolute ceiling
liquidation_buffer_pct = 0.20           # Reject stops within 20% of margin-call distance

[modes]
default = "AGGRESSIVE"          # Profit-first default

# ── Per-Strategy Profiles ──
# Strategies without a profile use global defaults (bb_rsi_mr)

[strategy_profiles.donchian_ensemble_adx]
confidence_floor = 0.5          # Trend signals are inherently uncertain
use_ev_gate = true              # Use expected value instead of raw confidence
ev_threshold = 0.4              # conf * (avg_win/avg_loss) must exceed this
drawdown_sensitivity = 0.6      # 60% of normal drawdown scaling
drawdown_floor = 0.2            # Never reduce below 20% size
use_risk_based_limits = true    # Risk-based instead of notional (wide stops)
max_risk_pct_per_position = 0.04  # 4% risk cap per position

[strategy_profiles.vol_momentum]
confidence_floor = 0.6
skip_kelly_vol_scaling = true   # Strategy already has internal vol_scalar
drawdown_sensitivity = 0.5      # 50% of normal drawdown scaling
drawdown_floor = 0.3            # Never reduce below 30% size
use_risk_based_limits = true
max_risk_pct_per_position = 0.04

[profiles.aggressive_retail]
# G.2c Tier 5 aggressive sub-book profile.
# Leverage gates are DISABLED so 1000× retail scalping can run, but
# fat_finger stays ACTIVE to prevent mis-keyed disasters.
leverage_gate_per_position_enabled = false
leverage_gate_aggregate_enabled = false
liquidation_buffer_check_enabled = false
fat_finger_max_value_usd_override = 100.0
duplicate_filter_enabled = true
daily_loss_limit_sub_book_pct = 0.30
max_concurrent_aggressive_positions = 3
