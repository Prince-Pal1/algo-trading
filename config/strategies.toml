[funding_carry]
# Strategy A — Perpetual Funding Rate Carry (Phase 3b-3).
# v1 uses the synthetic `BTCUSDT-CARRY` symbol. The FundingSyntheticFeed
# (src/data/feeds/funding_synthetic_feed.py) polls /fapi/v1/premiumIndex
# every 5 min and emits a synthetic bar at each 8h settlement. Signals
# route through M3S → risk_client → paper_executor via
# TradingEngine._handle_carry_signal. Real multi-leg Futures execution
# deferred to v2.
# Gate history:
#   A.1 research: PASS (retail Sharpe 0.6-0.9)
#   A.3 synthetic backtest: Sharpe 2.584
#   A.4 MC/fee/crash/WF-OOS: PASS
#   A.5 M3S integration: PASS
#   Real data backtest (4.3 years): Sharpe 0.533 (soft pass, above 0.3 kill),
#     +2.62% total return, 62 trades, max DD 0.36%
enabled = true                  # ACTIVATED Session 22 after real-data backtest
risk_profile = "SAFE"
markets = ["BTCUSDT-CARRY"]
timeframe = "8h"
max_risk_per_trade = 0.01
friction_pct = 0.00005          # 0.005% per 8h epoch (amortized; see funding_synthetic.py)
flip_persistence_bars = 3       # close on 3 consecutive negative-funding epochs (24h)
max_drawdown_kill_pct = 0.03    # 3% unrealized DD kills the position
max_hold_bars = 0               # 0 = no time stop
cooldown_bars = 3               # wait 3 epochs after exit before re-entering

[funding_mean_reversion]
# Backlog #8 — Funding-rate mean reversion (Session 23 validation).
# Fades extreme funding spikes: SHORT on top-quantile funding (crowded longs
# expected to mean-revert down), LONG on bottom-quantile (crowded shorts
# expected to rebound). Orthogonal to funding_carry which harvests normal
# structural funding; this strategy trades the *tail* of the distribution.
#
# Validation (2026-04-19, 4.3y BTCUSDT with binance_perpetual_futures fees):
#   Stage 3 (fee-aware): 479 trades, Sharpe +0.604, net +97%   ✅
#   Stage 4 MC:          P(profit) = 89%, median Sharpe 0.70   ✅
#   Stage 4 stability:   3/4 windows profitable                ✅
#   Stage 5 grid:        std 0.147, 27/27 cells positive       ✅
#   Stage 6 portfolio:   corr with funding_carry = +0.027      ✅
#   Stage 7 WF (7-fold): 5/7 profitable, Calmar +6.36          ✅
# Verdict: PASS (with regime filter; see min_funding_std_bps note below).
# Reports: reports/funding_mr_stage34/
#
# Execution note: economically requires Binance perpetual futures fees
# (0.04%/side). On Binance spot (0.10%/side), commission eats 87% of the
# gross edge (Sharpe collapses to 0.14). Live deployment is blocked until
# the Binance Futures executor ships — strategy runs in SHADOW mode on the
# spot engine for now.
enabled = true                   # Session 23 Day 2 — enable in shadow mode
risk_profile = "SAFE"
markets = ["BTCUSDT"]
timeframe = "8h"
max_risk_per_trade = 0.01
quantile_window = 90            # ~30 days of 8h (tuned Stage 5)
high_quantile = 0.90            # tuned Stage 5 (tighter entries than original 0.95)
low_quantile = 0.10
mid_quantile = 0.50
atr_sl_mult = 2.5
atr_period = 14
max_hold_bars = 6               # ≤ 48h
cooldown_bars = 2
long_only = false
# Regime filter (Stage 5.5, Session 23 Day 2):
# Skip entries when 30-day rolling std of funding_rate is below threshold
# (0.3 bps = 3e-5 decimal). Without this, WF folds 4-6 bled in the 2024
# low-vol regime. With it: 4/7 → 5/7 profitable, Calmar 4.19 → 6.36.
regime_filter_window = 90
min_funding_std_bps = 0.3

[liquidation_cascade]
# Session 23 Strategy 3 — liquidation cascade reversion (Backlog #6).
# Fades forced-liquidation cascades on BTCUSDT 1m. Detects via extreme
# negative 1m return z-score (>4σ) with abs move >50 bps; enters LONG,
# exits on SL -200/TP +100/30-min time-stop. Economic viability
# requires Binance perpetual futures fees (0.04%/side); on spot
# (0.10%/side), commission drag eats most of the edge.
#
# Stage 1 research (2026-04-19, 6.5mo BTC 1m):
#   71 cascade events detected (10.7/month)
#   66.2% retrace 50% within 30 min
#   Best config (SL -200/TP +100/30m): Sharpe +0.138 per trade,
#     57.7% win rate, +9.6% gross over 6.5mo
# Stages 2-7 pending. Shipping in shadow AFTER Stage 7 pass.
enabled = false
risk_profile = "SAFE"
markets = ["BTCUSDT"]
timeframe = "1m"
max_risk_per_trade = 0.01
cascade_sigma = 4.0
cascade_min_move_bps = 50.0
rolling_window_bars = 1440           # 1 day of 1m bars for std reference
sl_bps = 200.0                       # stop 200 bps below entry
tp_bps = 100.0                       # take profit 100 bps above entry
max_hold_bars = 30                   # 30-min time stop
cooldown_bars = 60                   # 1h gap between trades
long_only = true                     # only fade down-cascades for now

