# Strategy parameters — each strategy reads its section here

[ema_crossover]
enabled = false                  # Deprecated: EMA crossover not profitable on crypto intraday
risk_profile = "SAFE"
markets = ["BTCUSDT", "ETHUSDT"]
timeframe = "1m"
fast_period = 9
slow_period = 21
rsi_period = 7
rsi_overbought = 70
rsi_oversold = 30
volume_confirmation = true
volume_multiplier = 1.2
max_risk_per_trade = 0.01
take_profit_ratio = 2.0
min_ema_gap_atr = 0.3
cooldown_bars = 10
min_sl_atr = 0.5
max_notional_pct = 2.0

[bb_rsi_mr]
enabled = true
risk_profile = "SAFE"
# Validated symbols: altcoins that mean-revert well on 1h
# BTC excluded — trends too aggressively even at ADX<20
markets = ["ETHUSDT", "BNBUSDT", "ADAUSDT", "DOTUSDT", "APTUSDT"]
timeframe = "1h"
bb_period = 20
rsi_period = 14
adx_period = 14
atr_period = 14
rsi_overbought = 75             # strict: only enter at extremes
rsi_oversold = 25               # strict: only enter at extremes
adx_threshold = 20              # strict: only trade in truly flat markets
sl_atr_mult = 3.0               # 3 ATR stop — room to breathe
max_hold_bars = 48              # timeout after 48 bars (2 days)
cooldown_bars = 5               # wait 5 bars after exit
max_risk_per_trade = 0.01       # 1% equity risk per trade
max_notional_pct = 2.0          # max position = 2x equity

[donchian_ensemble_adx]
enabled = true
risk_profile = "SAFE"
# Trend-following works best on high-momentum, liquid altcoins
markets = ["ETHUSDT", "BNBUSDT", "NEARUSDT", "AVAXUSDT", "XRPUSDT"]
timeframe = "1h"
dc_short = 20
dc_medium = 55
dc_long = 120
atr_period = 14
sl_atr_mult = 2.5
max_hold_bars = 120
cooldown_bars = 5
min_channels = 2
adx_trend_threshold = 20
max_risk_per_trade = 0.015

[vol_momentum]
enabled = true
risk_profile = "SAFE"
# Vol-scaled momentum on high-volatility coins
markets = ["DOGEUSDT", "ADAUSDT", "DOTUSDT"]
timeframe = "1h"
momentum_window = 168
vol_lookback = 168
atr_period = 14
sl_atr_mult = 3.0
max_hold_bars = 168
cooldown_bars = 5
rebalance_interval = 24
momentum_threshold = 0.01
max_risk_per_trade = 0.012

[asian_range_breakout]
enabled = false                  # Enable in Phase 2
risk_profile = "SAFE"
markets = ["XAUUSD"]
timeframe = "15m"
asian_session_start = "00:00"   # UTC
asian_session_end = "08:00"     # UTC
breakout_buffer_pips = 5
take_profit_pips = 50
stop_loss_pips = 25
max_risk_per_trade = 0.005      # 0.5% of equity
max_trades_per_day = 2

[funding_carry]
# Strategy A — Perpetual Funding Rate Carry (Phase 3b-3).
# v1 uses the synthetic `BTCUSDT-CARRY` symbol. The FundingSyntheticFeed
# (src/data/feeds/funding_synthetic_feed.py) polls /fapi/v1/premiumIndex
# every 5 min and emits a synthetic bar at each 8h settlement. Signals
# route through M3S → risk_client → paper_executor via
# TradingEngine._handle_carry_signal. Real multi-leg Futures execution
# deferred to v2.
# Gate history:
#   A.1 research: PASS (retail Sharpe 0.6-0.9)
#   A.3 synthetic backtest: Sharpe 2.584
#   A.4 MC/fee/crash/WF-OOS: PASS
#   A.5 M3S integration: PASS
#   Real data backtest (4.3 years): Sharpe 0.533 (soft pass, above 0.3 kill),
#     +2.62% total return, 62 trades, max DD 0.36%
enabled = true                  # ACTIVATED Session 22 after real-data backtest
risk_profile = "SAFE"
markets = ["BTCUSDT-CARRY"]
timeframe = "8h"
max_risk_per_trade = 0.01
friction_pct = 0.00005          # 0.005% per 8h epoch (amortized; see funding_synthetic.py)
flip_persistence_bars = 3       # close on 3 consecutive negative-funding epochs (24h)
max_drawdown_kill_pct = 0.03    # 3% unrealized DD kills the position
max_hold_bars = 0               # 0 = no time stop
cooldown_bars = 3               # wait 3 epochs after exit before re-entering

[clenow_momentum]
# Strategy B — Cross-Sectional Altcoin Momentum (Clenow) — 💀 KILLED AT B.3
# Obituary: docs/strategy_obituaries/strategy_b_clenow_momentum.md
# B.3 backtest on 9-altcoin 2-year window produced avg Sharpe -0.124 (fail 0.1 kill gate).
# Infrastructure kept for future revival (rank cache, RankCache primitive, builder script).
# Config section preserved with enabled=false so nothing wires it into production.
enabled = false                 # KILLED — never flip to true without re-running B.3 with 30+ symbol universe
risk_profile = "SAFE"
markets = ["BTCUSDT", "ETHUSDT", "BNBUSDT", "SOLUSDT", "XRPUSDT", "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "DOTUSDT", "NEARUSDT"]
timeframe = "1d"
max_risk_per_trade = 0.01
lookback_days = 60
top_n = 5
rebalance_cadence_days = 7
trend_ma_window = 50
gap_filter_pct = 0.15
regime_ma_window = 100
rank_cache_path = "data/historical/momentum_rank_cache.parquet"
cooldown_bars = 0
