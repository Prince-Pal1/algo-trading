# Copy this to exchanges.toml and fill in your keys
# exchanges.toml is gitignored — never commit real keys

[binance]
api_key = "your-binance-api-key"
api_secret = "your-binance-api-secret"
testnet = true
ws_url = "wss://stream.binance.com:9443/ws"
