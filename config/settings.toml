[general]
mode = "paper"                  # "paper" | "live"
log_level = "INFO"              # "DEBUG" | "INFO" | "WARNING" | "ERROR"
data_dir = "data"

[redis]
host = "localhost"
port = 6379
db = 0
enabled = false                 # Set true when Redis is installed

[database]
path = "data/trades.db"         # SQLite path (Phase 1-3)

[telegram]
enabled = false
bot_token = ""                  # Set via env var TELEGRAM_BOT_TOKEN
chat_id = ""                    # Set via env var TELEGRAM_CHAT_ID

[scheduler]
market_hours_only = true
market_open = "09:30"           # ET
market_close = "16:00"          # ET
timezone = "US/Eastern"

[m3s]
# Master Money Management System — phase 3b-2 (wired sub-phase 0.8).
# enabled=true boots M3S; shadow_mode=true means log only, no signal mutation.
# Authoritative mode requires a second explicit flip (shadow_mode=false)
# after 4 consecutive clean days from scripts/m3s_shadow_check.py (compressed
# from 7 days in Session 22 sprint).
enabled = true
mode = "STANDARD"               # CONSERVATIVE | STANDARD | GROWTH | CUSTOM
shadow_mode = false  # true = log only, no signal mutation
db_path = "data/m3s.sqlite"
rebalance_cadence_hours = 24.0

[m3s_gold]
# Gold-specific M3S bucket (separate from crypto M3S above).
# Only used by LeveragedBacktestEngine + gold paper/live runs.
enabled = true
mode = "STANDARD"
aggregate_leverage_cap = 80.0
news_calendar_path = "config/news_calendar.csv"

[m3s_gold.allocation]
# Split of the gold allocation between the institutional book (Tiers 1-4,
# disciplined leverage) and the aggressive retail sub-book (Tier 5, 1000×
# scalping). Backtest sweep (G.2g) determines the Calmar-optimal split.
institutional_pct = 0.70
aggressive_pct = 0.30

[m3s_gold.aggressive_sub_book]
position_size_pct = 0.05
allow_size_override = true
override_cap_pct = 0.10
max_drawdown_pct = 0.50
daily_loss_limit_pct = 0.30
cooldown_days_after_halt = 7
weekly_refund_enabled = true
weekly_refund_cap_pct = 1.00
max_concurrent_positions = 3

[meta_label]
# Phase 3c meta-label filter (Session 22 sprint).
# Runs BEFORE M3S so features match training distribution. Filter decision
# options: veto (return None) or scale (sigmoid multiplier on risk_pct).
# Shadow mode logs decisions without altering signals.
#
# Current models in data/models/meta_label/ are LR-only (LightGBM unavailable
# on this machine — libomp.dylib missing). AUC range 0.48-0.57 reflects the
# research memo's "small uplift on validated primary models" prediction.
# Shadow mode is the right deployment until we retrain with LightGBM.
enabled = true
shadow_mode = true   # 2026-05-10 (Session 25): flipped from false → true. Was silently
                     # vetoing 100% of vol_momentum signals using a near-random model
                     # (AUC 0.48–0.57). Inline comment above already said shadow is the
                     # right deployment for now; config disagreed with docs.
veto_threshold = 0.30
scale_sharpness = 8.0
scale_mode = false
reload_interval_seconds = 60
model_dir = "data/models/meta_label"


[engine_perp]
# Config for the Binance USD-M Perpetual Futures live engine
# (launchd plist com.algo-trading.engine-perp.plist). ONLY read when
# --broker binance_perpetual_futures is passed to src.main.
#
# SAFETY: allow_live_trading MUST be true for BinanceFuturesExecutor to
# even construct. Default here is false — must be an explicit opt-in
# after testnet validation clears. Even with true, max_order_notional_usd
# caps every order + a 10/min rate limit + 5s fill timeout apply.
#
# Additional env vars required in .env (NOT in this file — keys don't
# belong in version control):
#   BINANCE_FUTURES_API_KEY
#   BINANCE_FUTURES_API_SECRET
#   BINANCE_FUTURES_TESTNET=true  (keep true until manual gate to mainnet)
allow_live_trading = false
max_order_notional_usd = 200.0
