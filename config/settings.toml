[general]
mode = "paper"                  # "paper" | "live"
log_level = "INFO"              # "DEBUG" | "INFO" | "WARNING" | "ERROR"
data_dir = "data"

[redis]
host = "localhost"
port = 6379
db = 0
enabled = false                 # Set true when Redis is installed

[database]
path = "data/trades.db"         # SQLite path (Phase 1-3)

[telegram]
enabled = false
bot_token = ""                  # Set via env var TELEGRAM_BOT_TOKEN
chat_id = ""                    # Set via env var TELEGRAM_CHAT_ID

[scheduler]
market_hours_only = true
market_open = "09:30"           # ET
market_close = "16:00"          # ET
timezone = "US/Eastern"

[m3s]
# Master Money Management System — phase 3b-2 (wired sub-phase 0.8).
# enabled=true boots M3S; shadow_mode=true means log only, no signal mutation.
# Authoritative mode requires a second explicit flip (shadow_mode=false)
# after 7 consecutive clean days from scripts/m3s_shadow_check.py.
enabled = true
mode = "STANDARD"               # CONSERVATIVE | STANDARD | GROWTH | CUSTOM
shadow_mode = true              # true = log only, no signal mutation
db_path = "data/m3s.sqlite"
rebalance_cadence_hours = 24.0
