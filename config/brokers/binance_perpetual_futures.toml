taker_fraction_of_notional = 0.0003
maker_fraction_of_notional = 0.00015
contract_size = 1.0

[instruments.crypto.scenarios.bnb_discount]
description = "Binance perp Regular tier with BNB fee payment (10% discount on futures, not 25% like spot): 0.018% maker / 0.036% taker."
notes = """
Note: BNB discount on futures is 10%, NOT 25% like spot. Binance
differentiates. Only worth it if your BNB balance is being maintained
anyway for spot discount.
"""

[instruments.crypto.scenarios.bnb_discount.spread]
base_spread_pips = 1.0
normal_slip_pips = 1.0
atr_vol_mult = 0.0
news_spread_mult = 3.0
news_slip_mult = 3.0
pip_size = 0.0001

[instruments.crypto.scenarios.bnb_discount.commission]
