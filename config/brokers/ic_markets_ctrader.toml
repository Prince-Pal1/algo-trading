# Broker: IC Markets / platform: ctrader
#
# Generated by scripts/migrate_broker_fees.py from config/broker_fees.toml.
# The flat broker_fees.toml is still authoritative for the legacy
# src.backtest.fee_profiles registry; this file is the broker-first view
# used by src.fees.FeeManager.
#
# Scenarios derived during migration: illiquid (normal × 3.5) and
# volatile (normal × 2.0) — refined over time from the weekly spread
# sampler + fee_calibration/*.json empirical overrides.

[broker]
id = "ic_markets_ctrader"
name = "IC Markets"
platform = "ctrader"
regulator = "FSA Seychelles"
country = "Seychelles"
api_type = "ctrader_open_api"
account_types = ["Raw Spread", "Standard", "cTrader Raw"]
min_deposit_usd = 200.0
base_currencies = ["USD", "EUR", "GBP", "AUD", "SGD"]
notes = """
IC Markets cTrader Raw Spread. Primary deployment broker for the gold
stack (G.3 Day 1 demo-clock currently running). Verified live against
demo.ctraderapi.com 2026-04-17: 351 symbols, XAUUSD at 5-pip spread,
$3/$100k commission. KYC required for sandbox→production token access.
Primary live cost fixture = weekly London/NY overlap spread sampler.
"""

[leverage_max]
xauusd_metals = 500.0
fx_majors = 500.0
fx_minors = 500.0
crypto = 200.0
indices = 500.0

[instruments.fx_majors]
symbol_aliases = ["EURUSD", "GBPUSD", "USDJPY", "USDCHF", "AUDUSD", "USDCAD", "NZDUSD"]
contract_size = 100000.0
min_lot = 0.01
max_lot = 100.0
lot_step = 0.01

[instruments.fx_majors.scenarios.illiquid]
description = "fx_majors under illiquid conditions (Asian session, weekend approach, holiday) — spread × 3.5 vs normal."
notes = """
Derived during migration from the 'normal' profile. Refine via the weekly sampler's illiquid-bucket captures.
"""

[instruments.fx_majors.scenarios.illiquid.spread]
base_spread_pips = 0.35
normal_slip_pips = 0.35
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.0001

[instruments.fx_majors.scenarios.illiquid.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100000.0

[instruments.fx_majors.scenarios.normal]
description = "IC Markets cTrader Raw Spread, FX majors (EURUSD, GBPUSD, USDJPY etc), normal liquid session"
sources = [
    "https://www.icmarkets.com/global/en/trading-pricing/spreads",
    "https://www.databasemart.com/blog/customer-stories-115",
]
notes = """
For FX where 1 standard lot = $100,000 notional, cTrader's $3-per-$100k
formula equals $3/lot/side — nearly identical to MT4's $3.50. So FX
costs are similar across platforms.

Spread is much tighter than gold (EURUSD avg 0.10 pips per IC Markets).
Slippage on cTrader London server measured at 0.00001 (1 micro-pip)
on EURUSD per databasemart latency study — ECN orders are filled
near-instantly with negligible slip on liquid pairs.
"""

[instruments.fx_majors.scenarios.normal.spread]
base_spread_pips = 0.1
normal_slip_pips = 0.1
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.0001

[instruments.fx_majors.scenarios.normal.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100000.0

[instruments.fx_majors.scenarios.volatile]
description = "fx_majors under volatile-regime conditions (current ATR > 1.5× 30-bar rolling) — spread × 2 vs normal."
notes = """
Derived during migration from the 'normal' profile. Refine via live observation during high-vol windows.
"""

[instruments.fx_majors.scenarios.volatile.spread]
base_spread_pips = 0.2
normal_slip_pips = 0.2
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.0001

[instruments.fx_majors.scenarios.volatile.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100000.0

[instruments.xauusd_metals]
symbol_aliases = ["XAUUSD", "GOLD"]
contract_size = 100.0
min_lot = 0.01
max_lot = 100.0
lot_step = 0.01

[instruments.xauusd_metals.scenarios.illiquid]
description = "xauusd_metals under illiquid conditions (Asian session, weekend approach, holiday) — spread × 3.5 vs normal."
notes = """
Derived during migration from the 'normal' profile. Refine via the weekly sampler's illiquid-bucket captures.
"""

[instruments.xauusd_metals.scenarios.illiquid.spread]
base_spread_pips = 1.05
normal_slip_pips = 1.05
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.1

[instruments.xauusd_metals.scenarios.illiquid.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100.0
min_commission_usd = 0.0

[instruments.xauusd_metals.scenarios.news_active]
description = "IC Markets cTrader XAUUSD with news calendar widening enabled (load NFP/CPI/FOMC dates from news_calendar.csv)"
sources = [
    "https://fxnx.com/en/blog/gold-news-trading-nfp-cpi-fed-rates-guide",
    "https://www.vantagemarkets.com/en/academy/news-trading-gold/",
]
notes = """
Same as ic_markets_ctrader_xauusd_normal but with `news_windows` populated
from config/news_calendar.csv. During NFP/CPI/FOMC windows, spread × 5
and slippage × 5. Use this profile for strategies that trade through
high-impact news events.
"""

[instruments.xauusd_metals.scenarios.news_active.spread]
base_spread_pips = 0.3
normal_slip_pips = 0.3
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.1
load_news_calendar = true

[instruments.xauusd_metals.scenarios.news_active.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100.0

[instruments.xauusd_metals.scenarios.normal]
description = "IC Markets cTrader Raw Spread, XAUUSD, normal liquid session (London/NY overlap, no news)"
sources = [
    "https://www.icmarkets.com/global/en/trading-pricing/spreads",
    "https://www.icmarkets.eu/en/trading-pricing/trading-costs",
    "https://www.bestbrokers.com/reviews/ic-markets/spreads-fees-and-commissions/",
]
notes = """
Default profile for production cTrader backtests on gold.

Spread + slip calibrated as a conservative blend between IC Markets Global
Raw (avg 0.09 pips, official) and IC Markets EU Raw (avg 0.63 pips, spec
sheet PDF). At 0.30 pips spread + 0.30 pips slip, this matches peer ECN
brokers Pepperstone (0.20-0.30) and is conservative vs the Global number.

Commission is VOLUME-BASED at $3 per $100,000 notional USD traded. For
gold at $4500/oz × 100 oz lot = $450k notional → $13.50/side per lot.
This makes cTrader ~3.86× more expensive than MT4 for gold trading.
"""

[instruments.xauusd_metals.scenarios.normal.spread]
base_spread_pips = 0.3
normal_slip_pips = 0.3
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.1

[instruments.xauusd_metals.scenarios.normal.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100.0
min_commission_usd = 0.0

[instruments.xauusd_metals.scenarios.stress]
description = "IC Markets cTrader XAUUSD pessimistic stress test — 2× normal spread + slip, for worst-case strategy validation"
sources = [
    "Internal — applied 2× safety multiplier on normal scenario for stress testing",
]
notes = """
Use this profile to stress-test a strategy under conservative assumptions.
If a strategy survives the `stress` profile, its alpha is robust to cost
estimation error. If it only works in `normal`, the margin is thin.
"""

[instruments.xauusd_metals.scenarios.stress.spread]
base_spread_pips = 0.6
normal_slip_pips = 0.6
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.1

[instruments.xauusd_metals.scenarios.stress.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100.0

[instruments.xauusd_metals.scenarios.volatile]
description = "xauusd_metals under volatile-regime conditions (current ATR > 1.5× 30-bar rolling) — spread × 2 vs normal."
notes = """
Derived during migration from the 'normal' profile. Refine via live observation during high-vol windows.
"""

[instruments.xauusd_metals.scenarios.volatile.spread]
base_spread_pips = 0.6
normal_slip_pips = 0.6
atr_vol_mult = 0.0
news_spread_mult = 5.0
news_slip_mult = 5.0
pip_size = 0.1

[instruments.xauusd_metals.scenarios.volatile.commission]
type = "volume_based"
per_100k_notional_usd = 3.0
contract_size = 100.0
min_commission_usd = 0.0

